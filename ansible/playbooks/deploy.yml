---
###############################################################################
# deploy.yml — Application-layer deploy only
#
# Pulls new images and restarts containers without touching system configuration.
# Use this for every normal release.
#
# Required extra var:
#   image_tag   — the Docker image tag to deploy
#
# Usage:
#   ansible-playbook playbooks/deploy.yml --limit env_dev \
#     --extra-vars "image_tag=dev-a1b2c3d"
#
#   ansible-playbook playbooks/deploy.yml --limit env_prod \
#     --extra-vars "image_tag=v1.2.3"
###############################################################################

- name: "Deploy backend [{{ target_env | default('all') }}]"
  hosts: backend
  become: true
  gather_facts: false
  vars:
    backend_image_tag: "{{ image_tag | mandatory('Pass image_tag as --extra-vars') }}"
  pre_tasks:
    - name: Ensure application base directory exists
      ansible.builtin.file:
        path: "{{ app_base_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Ensure Docker Compose working directory exists
      ansible.builtin.file:
        path: "{{ docker_compose_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"
  roles:
    - role: docker
      tags: [docker]
    - role: backend
      tags: [deploy, backend]

- name: "Deploy frontend [{{ target_env | default('all') }}]"
  hosts: frontend
  become: true
  gather_facts: false
  vars:
    frontend_image_tag: "{{ image_tag | mandatory('Pass image_tag as --extra-vars') }}"
  pre_tasks:
    - name: Ensure application base directory exists
      ansible.builtin.file:
        path: "{{ app_base_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Ensure Docker Compose working directory exists
      ansible.builtin.file:
        path: "{{ docker_compose_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"
  roles:
    - role: docker
      tags: [docker]
    - role: nginx
      tags: [deploy, nginx]
    - role: frontend
      tags: [deploy, frontend]
