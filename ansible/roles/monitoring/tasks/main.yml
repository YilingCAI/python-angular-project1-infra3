---
# ── Amazon CloudWatch Agent ───────────────────────────────────────────────────
- name: Deploy CloudWatch agent configuration
  when: enable_cloudwatch | bool
  ansible.builtin.template:
    src: cloudwatch-config.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudwatch agent
  tags: [monitoring, cloudwatch]

- name: Start and enable CloudWatch agent
  when: enable_cloudwatch | bool
  ansible.builtin.systemd:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true
  tags: [monitoring, cloudwatch]

# ── Prometheus Node Exporter (optional) ───────────────────────────────────────
- name: Download Node Exporter archive
  when: enable_node_exporter | bool
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"
  tags: [monitoring, prometheus]

- name: Install Node Exporter binary
  when: enable_node_exporter | bool
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    extra_opts:
      - "--strip-components=1"
      - "--wildcards"
      - "*/node_exporter"
    mode: "0755"
  tags: [monitoring, prometheus]

- name: Deploy Node Exporter systemd unit
  when: enable_node_exporter | bool
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=nobody
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
      Restart=always
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd and start node exporter
  tags: [monitoring, prometheus]
