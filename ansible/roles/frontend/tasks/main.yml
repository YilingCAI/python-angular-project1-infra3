---
- name: Authenticate with AWS ECR
  ansible.builtin.shell: |
    aws ecr get-login-password --region {{ aws_region }} \
      | docker login --username AWS --password-stdin {{ ecr_registry }}
  changed_when: false
  tags: [frontend, ecr]

- name: Pull frontend Docker image
  community.docker.docker_image:
    name: "{{ frontend_image }}:{{ frontend_image_tag }}"
    source: pull
    force_source: true
  tags: [frontend, deploy]

# ── Option A (preferred): extract static build and serve via host Nginx ───────
- name: Extract Angular static files from image
  when: frontend_mode == 'extract'
  block:
    - name: Create temporary extraction container
      community.docker.docker_container:
        name: "{{ frontend_container_name }}-extract"
        image: "{{ frontend_image }}:{{ frontend_image_tag }}"
        state: present
        detach: false
        command: /bin/true

    - name: Copy Angular dist from container to Nginx root
      ansible.builtin.command: >
        docker cp {{ frontend_container_name }}-extract:/usr/share/nginx/html/. {{ frontend_static_path }}/
      changed_when: true

    - name: Set correct ownership on static files
      ansible.builtin.file:
        path: "{{ frontend_static_path }}"
        owner: nginx
        group: nginx
        recurse: true

    - name: Remove temporary extraction container
      community.docker.docker_container:
        name: "{{ frontend_container_name }}-extract"
        state: absent

    - name: Reload Nginx to serve updated files
      ansible.builtin.meta: flush_handlers
  notify: Reload nginx
  tags: [frontend, deploy]

# ── Option B: run Angular as a Docker container ───────────────────────────────
- name: Deploy frontend as a Docker container
  when: frontend_mode == 'container'
  block:
    - name: Deploy frontend Docker Compose file
      ansible.builtin.template:
        src: docker-compose.frontend.yml.j2
        dest: "{{ frontend_compose_file }}"
        owner: ec2-user
        group: ec2-user
        mode: "0644"
      notify: Restart frontend container

    - name: Start frontend container via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_dir }}"
        files:
          - docker-compose.frontend.yml
        state: present
        pull: never
  tags: [frontend, deploy]
