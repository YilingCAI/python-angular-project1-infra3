---
- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present
  tags: [nginx]

- name: Deploy main Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: Reload nginx
  tags: [nginx, config]

- name: Ensure conf.d directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [nginx]

- name: Remove default Nginx virtual host
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx
  tags: [nginx, config]

- name: Deploy application virtual host config
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/app.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: Reload nginx
  tags: [nginx, config]

- name: Ensure frontend static root exists
  ansible.builtin.file:
    path: "{{ frontend_static_path }}"
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"
  tags: [nginx]

- name: Start and enable Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  tags: [nginx]
